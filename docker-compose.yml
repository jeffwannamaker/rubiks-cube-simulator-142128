version: '3.8'

services:
  rubiks-cube-frontend:
    build:
      context: ./rubiks_cube_frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
      - REACT_APP_SITE_URL=http://localhost:3000
      - REACT_APP_ENABLE_DEBUG_MODE=false
      - REACT_APP_ENABLE_AI_SOLVER=true
      - REACT_APP_MAX_CUBE_SIZE=10
      - REACT_APP_DEFAULT_ANIMATION_SPEED=1.0
      - REACT_APP_MAX_HISTORY_SIZE=1000
    volumes:
      - ./rubiks_cube_frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Development service (alternative to production)
  rubiks-cube-dev:
    build:
      context: ./rubiks_cube_frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - REACT_APP_SITE_URL=http://localhost:3001
      - REACT_APP_ENABLE_DEBUG_MODE=true
      - REACT_APP_ENABLE_AI_SOLVER=true
      - REACT_APP_MAX_CUBE_SIZE=10
      - REACT_APP_DEFAULT_ANIMATION_SPEED=1.0
      - REACT_APP_MAX_HISTORY_SIZE=1000
    volumes:
      - ./rubiks_cube_frontend/src:/app/src:ro
      - ./rubiks_cube_frontend/public:/app/public:ro
    command: npm start
    profiles:
      - dev
    restart: unless-stopped

networks:
  default:
    name: rubiks-cube-network
