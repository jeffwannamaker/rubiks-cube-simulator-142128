<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#1a1a1a"/>
  
  <!-- Cube perspective -->
  <g transform="translate(100, 100)">
    <!-- Back face -->
    <g transform="translate(-15, -15)">
      <rect x="-30" y="-30" width="20" height="20" fill="#ff0000" stroke="#000" stroke-width="1"/>
      <rect x="-10" y="-30" width="20" height="20" fill="#ff0000" stroke="#000" stroke-width="1"/>
      <rect x="10" y="-30" width="20" height="20" fill="#ff0000" stroke="#000" stroke-width="1"/>
      <rect x="-30" y="-10" width="20" height="20" fill="#ff0000" stroke="#000" stroke-width="1"/>
      <rect x="-10" y="-10" width="20" height="20" fill="#ff0000" stroke="#000" stroke-width="1"/>
      <rect x="10" y="-10" width="20" height="20" fill="#ff0000" stroke="#000" stroke-width="1"/>
      <rect x="-30" y="10" width="20" height="20" fill="#ff0000" stroke="#000" stroke-width="1"/>
      <rect x="-10" y="10" width="20" height="20" fill="#ff0000" stroke="#000" stroke-width="1"/>
      <rect x="10" y="10" width="20" height="20" fill="#ff0000" stroke="#000" stroke-width="1"/>
    </g>
    
    <!-- Top face -->
    <g transform="skewX(-30) scaleY(0.5) translate(0, -30)">
      <rect x="-30" y="-30" width="20" height="20" fill="#ffffff" stroke="#000" stroke-width="1"/>
      <rect x="-10" y="-30" width="20" height="20" fill="#ffffff" stroke="#000" stroke-width="1"/>
      <rect x="10" y="-30" width="20" height="20" fill="#ffffff" stroke="#000" stroke-width="1"/>
      <rect x="-30" y="-10" width="20" height="20" fill="#ffffff" stroke="#000" stroke-width="1"/>
      <rect x="-10" y="-10" width="20" height="20" fill="#ffffff" stroke="#000" stroke-width="1"/>
      <rect x="10" y="-10" width="20" height="20" fill="#ffffff" stroke="#000" stroke-width="1"/>
      <rect x="-30" y="10" width="20" height="20" fill="#ffffff" stroke="#000" stroke-width="1"/>
      <rect x="-10" y="10" width="20" height="20" fill="#ffffff" stroke="#000" stroke-width="1"/>
      <rect x="10" y="10" width="20" height="20" fill="#ffffff" stroke="#000" stroke-width="1"/>
    </g>
    
    <!-- Right face -->
    <g transform="skewY(-30) scaleX(0.5) translate(30, 0)">
      <rect x="-30" y="-30" width="20" height="20" fill="#ff8c00" stroke="#000" stroke-width="1"/>
      <rect x="-10" y="-30" width="20" height="20" fill="#ff8c00" stroke="#000" stroke-width="1"/>
      <rect x="10" y="-30" width="20" height="20" fill="#ff8c00" stroke="#000" stroke-width="1"/>
      <rect x="-30" y="-10" width="20" height="20" fill="#ff8c00" stroke="#000" stroke-width="1"/>
      <rect x="-10" y="-10" width="20" height="20" fill="#ff8c00" stroke="#000" stroke-width="1"/>
      <rect x="10" y="-10" width="20" height="20" fill="#ff8c00" stroke="#000" stroke-width="1"/>
      <rect x="-30" y="10" width="20" height="20" fill="#ff8c00" stroke="#000" stroke-width="1"/>
      <rect x="-10" y="10" width="20" height="20" fill="#ff8c00" stroke="#000" stroke-width="1"/>
      <rect x="10" y="10" width="20" height="20" fill="#ff8c00" stroke="#000" stroke-width="1"/>
    </g>
  </g>
  
  <!-- Title -->
  <text x="100" y="180" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    RUBIK'S CUBE
  </text>
  <text x="100" y="195" text-anchor="middle" fill="#64b5f6" font-family="Arial, sans-serif" font-size="12">
    SIMULATOR
  </text>
</svg>
